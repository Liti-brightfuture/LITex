# LIT Bytes cards worker.
# Before deploying: create the KV namespace and fill in its id:
#   npx wrangler kv namespace create LIT_STATS
kv_namespaces = [
  { binding = "LIT_STATS", id = "REPLACE_AFTER_WRANGLER_LOGIN" }
]

name = "lit-bytes-cards"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

[[rules]]
type = "Data"
globs = ["**/*.woff"]
